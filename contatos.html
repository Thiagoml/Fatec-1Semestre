<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Última Xícara</title>
    <link rel="icon" href="./images/icon.png">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-sm navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="./images/icon.png" alt="Avatar Logo" style="width:40px;" class="rounded-pill">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="cardapio.html">Cardápio</a></li>
                        <li class="nav-item"><a class="nav-link" href="sobre-nos.html">Sobre</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="contatos.html">Contato</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Entre em contato com a Última Xícara</h1>
        </section>

        <section class="content">
            <div class="contato-grid">
                <div>
                    <h2>Envie sua mensagem</h2>
                    <form>
                        <div class="mb-3">
                            <label for="femail" class="form-label">Seu e-mail</label>
                            <input type="email" class="form-control" id="femail" name="femail" required>
                        </div>
                        <div class="mb-3">
                            <label for="lassunto" class="form-label">Assunto</label>
                            <input type="text" class="form-control" id="lassunto" name="lassunto" required>
                        </div>
                        <div class="mb-3">
                            <label for="    mensagem" class="form-label">Descrição</label>
                            <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </form>
                </div>

                <div>
                    <h2>Outros canais</h2>
                    <p><strong>E-mail:</strong> ultimaxicara@gmail.com</p>
                    <p><strong>Telefone:</strong> (12) 1234-5678</p>
                    <p><strong>Endereço:</strong> Rua do Café, 123 — Centro, São José dos Campos - SP</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Última Xícara</p>
    </footer>

</body>

</html>
